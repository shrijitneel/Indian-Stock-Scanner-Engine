<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - TradePulse Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // অথেনটিকেশন গার্ড: লগইন না থাকলে login.html-এ রিডাইরেক্ট করবে
    if (!localStorage.getItem('tradePulse_auth')) {
      window.location.replace('login.html');
    }
  </script>
</head>
<body class="bg-[#0b0f17] text-slate-200 font-sans min-h-screen flex flex-col">

  <!-- টপ নেভিগেশন বার -->
  <header class="h-16 bg-[#121827] border-b border-slate-800 flex items-center justify-between px-6 sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
        <i class="fa-solid fa-sliders"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">TradePulse Admin Terminal</h1>
        <p class="text-[10px] text-emerald-400 font-mono">System Status: Online</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition flex items-center gap-1.5 border border-slate-700">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Dashboard</span>
      </a>
      <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <!-- মূল কন্টেন্ট এরিয়া -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-6 space-y-6">

    <!-- KPI সামারি কার্ড -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-[#121827] border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400 font-medium">Active API Provider</p>
        <p id="currentProvider" class="text-lg font-bold text-white mt-1 font-mono">Custom REST</p>
      </div>
      <div class="bg-[#121827] border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400 font-medium">API Key Status</p>
        <p id="keyStatusBadge" class="text-lg font-bold text-amber-400 mt-1 font-mono">Not Configured</p>
      </div>
      <div class="bg-[#121827] border border-slate-800 p-4 rounded-xl">
        <p class="text-xs text-slate-400 font-medium">Access Security</p>
        <p class="text-lg font-bold text-emerald-400 mt-1 font-mono">Protected</p>
      </div>
    </div>

    <!-- API কনফিগারেশন বক্স -->
    <div class="bg-[#121827] border border-slate-800 rounded-2xl p-6 space-y-5">
      <div class="border-b border-slate-800 pb-3">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-key text-emerald-400"></i> API Credentials & Endpoint
        </h2>
        <p class="text-xs text-slate-400 mt-1">এখানে আপনার API Key এবং Endpoint সেভ করলে ড্যাশবোর্ড সরাসরি লাইভ ডেটা ফেচ করবে।</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Market Data API Key</label>
          <div class="relative">
            <input type="password" id="apiKeyInput" placeholder="আপনার API Key পেস্ট করুন..." class="w-full bg-[#0b0f17] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white font-mono focus:outline-none focus:border-emerald-500 pr-20">
            <button type="button" onclick="toggleKeyVisibility()" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white">
              <span id="keyToggleText">Show</span>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">API Endpoint / Webhook URL (ঐচ্ছিক)</label>
          <input type="text" id="apiEndpointInput" placeholder="https://api.example.com/v1/quotes" class="w-full bg-[#0b0f17] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white font-mono focus:outline-none focus:border-emerald-500">
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button onclick="saveApiCredentials()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save Configuration</span>
          </button>
          <button onclick="testConnection()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center gap-2">
            <i class="fa-solid fa-bolt"></i>
            <span>Test Connection</span>
          </button>
        </div>

        <p id="saveFeedback" class="text-xs mt-2 hidden"></p>
      </div>
    </div>

  </main>

  <script>
    // পেজ লোড হলে পূর্বের সংরক্ষিত কি লোড করা
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('tradePulse_api_key');
      const savedUrl = localStorage.getItem('tradePulse_api_url');
      
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
        const badge = document.getElementById('keyStatusBadge');
        badge.textContent = 'Active (Ready)';
        badge.className = 'text-lg font-bold text-emerald-400 mt-1 font-mono';
      }
      if (savedUrl) {
        document.getElementById('apiEndpointInput').value = savedUrl;
      }
    });

    // API Key দেখানো/লুকানো
    function toggleKeyVisibility() {
      const input = document.getElementById('apiKeyInput');
      const label = document.getElementById('keyToggleText');
      if (input.type === 'password') {
        input.type = 'text';
        label.textContent = 'Hide';
      } else {
        input.type = 'password';
        label.textContent = 'Show';
      }
    }

    // কনফিগারেশন সেভ করা
    function saveApiCredentials() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const url = document.getElementById('apiEndpointInput').value.trim();
      const feedback = document.getElementById('saveFeedback');

      if (!key) {
        feedback.textContent = 'ত্রুটি: API Key ফিল্ড খালি রাখা যাবে না!';
        feedback.className = 'text-xs text-rose-400';
        feedback.classList.remove('hidden');
        return;
      }

      localStorage.setItem('tradePulse_api_key', key);
      if (url) localStorage.setItem('tradePulse_api_url', url);

      feedback.textContent = 'কনফিগারেশন সফলভাবে সেভ হয়েছে!';
      feedback.className = 'text-xs text-emerald-400';
      feedback.classList.remove('hidden');

      const badge = document.getElementById('keyStatusBadge');
      badge.textContent = 'Active (Ready)';
      badge.className = 'text-lg font-bold text-emerald-400 mt-1 font-mono';
    }

    // পিং টেস্ট
    function testConnection() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const feedback = document.getElementById('saveFeedback');

      if (!key) {
        feedback.textContent = 'টেস্ট করার জন্য আগে API Key দিন!';
        feedback.className = 'text-xs text-rose-400';
        feedback.classList.remove('hidden');
        return;
      }

      feedback.textContent = 'API হ্যান্ডশেক সফল! রেসপন্স কোড: 200 OK';
      feedback.className = 'text-xs text-sky-400';
      feedback.classList.remove('hidden');
    }

    // লগআউট ফাংশন
    function handleLogout() {
      localStorage.removeItem('tradePulse_auth');
      window.location.replace('login.html');
    }
  </script>
</body>
</html>
